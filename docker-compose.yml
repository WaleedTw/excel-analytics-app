services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bayyinah
      POSTGRES_USER: bayyinah
      POSTGRES_PASSWORD: bayyinah
    ports: ["5432:5432"]
    volumes: ["bayyinah_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayyinah"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bayyinah_postgres:

